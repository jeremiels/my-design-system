<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Legacy browser smoke test</title>
    <!-- The built library, exactly as shipped (npm run build). -->
    <link rel="stylesheet" href="/dist/styles.css" />
    <!-- dist/ keeps Lit external: resolve its bare specifiers to Lit's own published files. -->
    <script type="importmap">
      {
        "imports": {
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script>
      window.__errors = [];
      addEventListener("error", (event) => window.__errors.push(String(event.message)));
      addEventListener("unhandledrejection", (event) => window.__errors.push(String(event.reason)));
      const consoleError = console.error;
      console.error = (...args) => {
        window.__errors.push(args.map(String).join(" "));
        consoleError(...args);
      };
    </script>
    <script
      type="module"
      src="./checks.js"
      onerror="window.__errors.push('checks.js failed to load')"
    ></script>
  </head>
  <body>
    <form id="form">
      <my-button id="submit" type="submit">Submit</my-button>
    </form>
    <my-button id="disabled" disabled>Disabled</my-button>
    <my-button-link id="link" href="#x">Link</my-button-link>
    <my-alert id="info">Information</my-alert>
    <my-alert id="danger" type="danger">Danger</my-alert>
    <my-modal id="modal"><p>Content</p></my-modal>
  </body>
</html>
