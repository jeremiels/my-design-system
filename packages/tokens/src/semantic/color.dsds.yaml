    name: "Anneau de focus"
    description: "L'anneau de focus d'un élément, sur une surface."
    sections:
      - kind: guidelines
        for: all
        items:
          - level: must
            statement: "Dessinez l'anneau de focus d'un élément de l'application avec `color.focus-ring`, et son épaisseur avec `focus-ring.width`."
