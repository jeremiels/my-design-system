    source: ./theme.light.tokens.json
    combos:
      - subject: "{color.focus-ring}"
        level: must
        items:
          - "{color.surface.default}"
          - "{color.surface.raised}"
        note: "Le contraste de 3:1 d'un élément d'interface (WCAG 1.4.11) est mesuré sur ces surfaces, dans les deux thèmes."
  - kind: token
    id: color.border.control
    name: "Bordure de contrôle"
    description: "La bordure d'un contrôle de formulaire, sur une surface."
    sections:
      - kind: guidelines
        for: all
        items:
          - level: must
            statement: "Bordez un contrôle de formulaire avec `color.border.control`, pas avec `color.border.default` : seule la première garde 3:1 sur les surfaces."
            checkedBy: manual
    source: ./theme.light.tokens.json
    combos:
      - subject: "{color.border.control}"
        level: must
        items:
          - "{color.surface.default}"
          - "{color.surface.raised}"
        note: "Le contraste de 3:1 d'un élément d'interface (WCAG 1.4.11) est mesuré sur ces surfaces, dans les deux thèmes."
