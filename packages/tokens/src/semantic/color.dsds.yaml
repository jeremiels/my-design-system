# Les règles d'usage des tokens sémantiques de couleur (DSDS), et leurs paires :
# sur quel fond poser chaque couleur. Les valeurs et les descriptions vivent
# dans les sources DTCG ; une entrée dit comment utiliser son token.
# packages/tokens/testing/contrast.ts mesure le contraste de chaque paire,
# dans les deux thèmes (ADR 0046).
schemaVersion: "0.23.1"
$schema: https://designsystemdocspec.org/v0.23.1/dsds.bundled.yaml
name: Tokens sémantiques de couleur
entries:
  - kind: token
    id: color.action.background
    name: "Fond action"
    description: "Le fond d'une action principale, au repos. Son texte et ses icônes sont `color.action.text`. Aussi la couleur d'un indicateur sur une surface : spinner, barre de progression, étapes."
    source: ./theme.light.tokens.json
    combos:
      - subject: "{color.action.background}"
        level: should
        items:
          - "{color.surface.default}"
          - "{color.surface.raised}"
        note: "Comme couleur d'un indicateur, le contraste de 3:1 (WCAG 1.4.11) est mesuré sur ces surfaces, dans les deux thèmes."
  - kind: token
    id: color.action.background-hover
    name: "Fond action (survol)"
    description: "Le fond d'une action principale, sous le pointeur. Son texte et ses icônes sont `color.action.text`."
    source: ./theme.light.tokens.json
  - kind: token
    id: color.action.background-active
    name: "Fond action (pressé)"
    description: "Le fond d'une action principale, pendant qu'on le presse. Son texte et ses icônes sont `color.action.text`."
    source: ./theme.light.tokens.json
  - kind: token
    id: color.action.text
    name: "Texte sur action"
    description: "Le texte et les icônes posés sur le fond d'une action principale, au repos, survolé et pressé."
    source: ./theme.light.tokens.json
    combos:
      - subject: "{color.action.text}"
        level: must
        items:
          - "{color.action.background}"
          - "{color.action.background-hover}"
          - "{color.action.background-active}"
        note: "Le contraste de 4,5:1 est mesuré sur ces fonds, dans les deux thèmes."
  - kind: token
    id: color.action.foreground
    name: "Premier plan d'action"
    description: "Le texte et la bordure d'une action principale sur une surface, comme un bouton `outlined`."
    source: ./theme.light.tokens.json
    combos:
      - subject: "{color.action.foreground}"
        level: must
        items:
          - "{color.surface.default}"
          - "{color.surface.raised}"
          - "{color.neutral.background}"
          - "{color.neutral.background-hover}"
        note: "Le contraste de 4,5:1 est mesuré sur ces fonds, dans les deux thèmes."
  - kind: token
    id: color.secondary.background
