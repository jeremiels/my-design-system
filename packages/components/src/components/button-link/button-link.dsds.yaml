# Quand utiliser button-link (DSDS). Son API vit dans custom-elements.json.
kind: component
id: button-link
name: Button link
description: Un lien qui a l'apparence d'un bouton.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `button-link` pour aller vers une autre page, avec `href`.
        checkedBy: manual
      - level: must-not
        statement: N'utilisez pas `button-link` pour une action dans la page. Utilisez <dsds:button>.
        alternatives:
          - to: button
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: "Donnez au lien un `href` : sans lui, il ne mène nulle part."
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - href
      - level: must
        statement: Donnez au lien un libellé dans son slot. Un lien qui ne montre qu'une icône reçoit son nom par `label`.
        checks:
          - href: npm:@unicorne/catalog#accessible-name
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: must-not
        statement: N'enveloppez pas `button-link` dans un `<a>` ou un `<button>`. Le composant rend déjà son propre `<a>`.
        checks:
          - href: npm:@unicorne/catalog#forbidden-ancestor
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - a
                - button

refs:
  - href: ./button-link.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./button-link.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
