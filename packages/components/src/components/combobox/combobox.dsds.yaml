# Quand utiliser combobox, et ses règles (DSDS). Son API vit dans custom-elements.json.
kind: component
id: combobox
name: Combobox
description: Un champ qui filtre des options par le texte, et dont la valeur est l'une d'elles.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `combobox` quand la valeur est l'une de nombreuses options, que l'usager trouve en tapant.
        checkedBy: manual
      - level: must-not
        statement: N'utilisez pas `combobox` pour un texte libre. Utilisez <dsds:autocomplete>.
        alternatives:
          - to: autocomplete
        checkedBy: manual
      - level: should
        statement: Pour quelques options, sans saisie, utilisez <dsds:select>.
        alternatives:
          - to: select
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Plusieurs valeurs
    items:
      - level: must
        statement: Avec `multiple`, traduisez `values-label`. Il nomme la liste des options choisies, sous le champ.
        checks:
          - href: ./combobox.stories.ts#Multiple
            role: test
        checkedBy: automated
      - level: must
        statement: Lisez les valeurs dans `values`. Le formulaire reçoit une entrée par valeur, sous `name`.
        checks:
          - href: ./combobox.test.ts
            role: test
        checkedBy: automated

  - kind: guidelines
    for: all
    title: Options
    items:
      - level: must
        statement: Écrivez les options en éléments `<option>`, enfants directs du champ, ou donnez-les par `options`.
        checks:
          - href: npm:@unicorne/catalog#allowed-children
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - option

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: "Donnez au champ un `label` : il s'affiche, et nomme le contrôle."
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: should
        statement: Écrivez dans `hint` le format attendu, et dans `error-message` comment corriger l'erreur.
        checkedBy: manual
      - level: must-not
        statement: "N'enveloppez pas le champ dans un `<label>` : il rend son propre libellé."
        checks:
          - href: npm:@unicorne/catalog#forbidden-ancestor
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - label

refs:
  - href: ./combobox.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./combobox.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
