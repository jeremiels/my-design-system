# Quand utiliser checkbox-group, et ses règles (DSDS). Son API vit dans custom-elements.json.
kind: component
id: checkbox-group
name: Checkbox group
description: Un groupe de cases à cocher, pour choisir plusieurs options d'une question.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `checkbox-group` pour choisir plusieurs options d'une même question.
        checkedBy: manual
      - level: should
        statement: Pour une seule option parmi plusieurs, utilisez <dsds:radio-group>.
        alternatives:
          - to: radio-group
        checkedBy: manual
      - level: should
        statement: Pour de nombreuses options, utilisez <dsds:combobox> avec `multiple`.
        alternatives:
          - to: combobox
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Options
    items:
      - level: must
        statement: Écrivez chaque option dans un <dsds:checkbox>, enfant direct du groupe.
        checks:
          - href: npm:@unicorne/catalog#allowed-children
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              components:
                - checkbox
      - level: must
        statement: "Donnez à chaque case un `value`, et pas de `name` : le groupe envoie les valeurs sous son `name`."
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: "Donnez au groupe un `label` : il pose la question, et nomme le groupe."
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: should
        statement: Écrivez dans `hint` le format attendu, et dans `error-message` comment corriger l'erreur.
        checkedBy: manual
      - level: must-not
        statement: "N'enveloppez pas le champ dans un `<label>` : il rend son propre libellé."
        checks:
          - href: npm:@unicorne/catalog#forbidden-ancestor
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - label

refs:
  - href: ./checkbox-group.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./checkbox-group.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
