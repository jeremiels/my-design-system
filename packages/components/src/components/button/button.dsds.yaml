# Quand utiliser button, et ses règles (DSDS). Son API (attributs, slot,
# part, tokens, événement) vit dans custom-elements.json.
kind: component
id: button
name: Button
description: Un bouton qui déclenche une action dans la page.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `button` pour une action dans la page, comme envoyer un formulaire ou ouvrir une modale.
        checkedBy: manual
      - level: must-not
        statement: N'utilisez pas `button` pour aller vers une autre page. Utilisez <dsds:button-link>.
        alternatives:
          - to: button-link
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Variantes
    items:
      - level: should
        statement: Limitez chaque zone de l'écran à un seul bouton `primary`.
        checkedBy: manual
      - level: should-not
        statement: Ne choisissez pas une variante pour sa couleur. Choisissez-la pour l'intention de l'action.
        checkedBy: manual
      - level: should
        statement: Donnez l'apparence `outlined` ou `plain` aux actions secondaires d'une zone, et `neutral` aux actions sans intention, comme fermer ou retirer.
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Formulaires
    items:
      - level: must
        statement: Utilisez `type="submit"` pour envoyer le formulaire qui contient le bouton.
        checks:
          - href: ./button.stories.ts#SubmitsForm
            role: test
        checkedBy: automated
      - level: must
        statement: Désactivez le bouton avec `disabled`. Il n'émet alors aucun `click` et porte `aria-disabled`.
        checks:
          - href: ./button.stories.ts#Disabled
            role: test
        checkedBy: automated

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: Donnez au bouton un libellé dans son slot. Ce libellé est son nom accessible. Un bouton qui ne montre qu'une icône reçoit son nom par `label`.
        checks:
          - href: ./button.stories.ts
            role: test
            note: L'addon a11y lance axe sur chaque story, dans Chromium, Firefox et WebKit.
        checkedBy: automated
      - level: must
        statement: Gardez l'anneau de focus visible, avec un contraste de 3:1 sur les surfaces.
        checks:
          - href: ../../../../tokens/testing/tokens.test.ts
            role: test
        checkedBy: automated
      - level: should-not
        statement: Ne retirez pas le bouton de l'ordre de tabulation.
        checkedBy: manual

  - kind: guidelines
    for: agent
    items:
      - level: must-not
        statement: N'enveloppez pas `u-button` dans un `<button>` ou un `<a>`. Le composant rend déjà son propre `<button>`.
        checkedBy: manual
      - level: must-not
        statement: Ne recopiez pas la liste des attributs ou des tokens. Lisez `custom-elements.json`.
        checkedBy: manual
      - level: must
        statement: Dans un composant du socle, rendez `button` par `tagFor(Button)` pour tout contrôle qui a l'air d'un bouton, jamais un `<button>` natif (ADR 0031).
        checks:
          - href: ../../composition.test.ts
            role: test
        checkedBy: automated
        $extensions:
          dev.unicorne:
            context: Une règle des contributeurs du socle. La documentation d'un design system construit sur le socle la laisse de côté.
            audience: contributors

refs:
  - href: ./button.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./button.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest

traits:
  - traitType: variant
    kind: enum
    id: variant
    description: L'intention de l'action. Elle fixe les couleurs du bouton.
    values:
      - id: primary
        description: L'action principale d'une zone.
      - id: secondary
        description: Une action secondaire, à côté de l'action principale.
      - id: neutral
        description: Une action sans intention, comme fermer, retirer ou faire défiler.
      - id: success
        description: Une action qui valide ou confirme.
      - id: danger
        description: Une action destructrice ou irréversible, comme une suppression.
      - id: warning
        description: Une action qui demande de l'attention avant de continuer.
      - id: information
        description: Une action qui donne plus d'informations.
  - traitType: variant
    kind: enum
    id: appearance
    description: Comment la variante peint le bouton.
    values:
      - id: filled
        description: Un fond plein, la valeur par défaut.
      - id: outlined
        description: Une bordure, sans fond, comme le déclencheur d'un menu.
      - id: plain
        description: Le texte seul, comme le bouton de fermeture d'une modale.
  - traitType: variant
    kind: enum
    id: size
    description: La taille du bouton.
    values:
      - id: small
        description: Pour une interface dense, comme une barre d'outils.
      - id: medium
        description: La taille par défaut.
      - id: large
        description: Pour une action mise en avant, ou une cible tactile plus grande.
  - traitType: state
    kind: boolean
    id: disabled
    description: Le bouton n'accepte aucune interaction et n'émet aucun `click`.
  - traitType: state
    kind: boolean
    id: loading
    description: L'action du bouton est en cours. Un spinner couvre le libellé, et le bouton ignore les clics mais garde le focus.
