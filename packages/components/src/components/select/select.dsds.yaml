# Quand utiliser select (DSDS). Son API vit dans custom-elements.json.
kind: component
id: select
name: Select
description: Un champ qui choisit une option dans une liste, sans saisie.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `select` pour choisir parmi quelques options, connues de l'usager.
        checkedBy: manual
      - level: should
        statement: Pour de nombreuses options, que l'usager trouve en tapant, utilisez <dsds:combobox>.
        alternatives:
          - to: combobox
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Options
    items:
      - level: must
        statement: Écrivez les options en éléments `<option>`, enfants directs du champ, ou donnez-les par `options`.
        checks:
          - href: npm:@unicorne/catalog#allowed-children
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - option

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: "Donnez au champ un `label` : il s'affiche, et nomme le contrôle."
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: should
        statement: Écrivez dans `hint` le format attendu, et dans `error-message` comment corriger l'erreur.
        checkedBy: manual
      - level: must-not
        statement: "N'enveloppez pas le champ dans un `<label>` : il rend son propre libellé."
        checks:
          - href: npm:@unicorne/catalog#forbidden-ancestor
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - label

refs:
  - href: ./select.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./select.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
