# Quand utiliser slider, et ses règles (DSDS). Son API vit dans custom-elements.json.
kind: component
id: slider
name: Slider
description: Un curseur, pour choisir un nombre entre deux bornes.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: "Utilisez `slider` pour une valeur approchée entre deux bornes : un volume, un rayon de recherche."
        checkedBy: manual
      - level: should
        statement: Pour une valeur précise, utilisez <dsds:number-field>.
        alternatives:
          - to: number-field
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Saisie
    items:
      - level: should
        statement: Donnez `min`, `max` et `step`. Sans eux, le curseur va de 0 à 100, par pas de 1.
        checkedBy: manual
      - level: should
        statement: Dites l'unité dans le libellé ou dans `hint`.
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: "Donnez au curseur un `label` : il s'affiche, et nomme le contrôle."
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: should
        statement: Écrivez dans `hint` le format attendu, et dans `error-message` comment corriger l'erreur.
        checkedBy: manual
      - level: may
        statement: Masquez le libellé avec `label-hidden` quand la mise en page dit le but du champ. Il nomme toujours le contrôle.
        checkedBy: manual
      - level: must-not
        statement: "N'enveloppez pas le champ dans un `<label>` : il rend son propre libellé."
        checks:
          - href: npm:@unicorne/catalog#forbidden-ancestor
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - label

refs:
  - href: ./slider.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./slider.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
