# Quand utiliser file-field, et ses règles (DSDS). Son API vit dans custom-elements.json.
kind: component
id: file-field
name: File field
description: Un champ qui choisit des fichiers à envoyer avec un formulaire.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `file-field` pour envoyer des fichiers avec un formulaire.
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Fichiers
    items:
      - level: should
        statement: Filtrez le sélecteur avec `accept`, et dites dans `hint` les types et la taille permis.
        checkedBy: manual
      - level: must
        statement: "Vérifiez les fichiers sur le serveur : `accept` filtre seulement le sélecteur."
        checkedBy: manual
      - level: must
        statement: Avec `multiple`, traduisez `files-label`. Il nomme la liste des fichiers choisis.
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: "Donnez au champ un `label` : il s'affiche, et nomme le contrôle."
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: should
        statement: Écrivez dans `hint` le format attendu, et dans `error-message` comment corriger l'erreur.
        checkedBy: manual
      - level: may
        statement: Masquez le libellé avec `label-hidden` quand la mise en page dit le but du champ. Il nomme toujours le contrôle.
        checkedBy: manual
      - level: must-not
        statement: "N'enveloppez pas le champ dans un `<label>` : il rend son propre libellé."
        checks:
          - href: npm:@unicorne/catalog#forbidden-ancestor
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              elements:
                - label

  - kind: guidelines
    for: agent
    items:
      - level: must-not
        statement: 'N''ajoutez pas d''`<input type="file">` : le composant rend le sien.'
        checkedBy: manual

refs:
  - href: ./file-field.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./file-field.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
