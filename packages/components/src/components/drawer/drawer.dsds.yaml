# Quand utiliser drawer (DSDS). Son API vit dans custom-elements.json.
kind: component
id: drawer
name: Drawer
description: Un panneau modal, le long d'un bord de la page.
metadata:
  origin:
    method: authored
    author: assisted
  status:
    status: experimental

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: must
        statement: Utilisez `drawer` pour un formulaire ou des détails, à côté de la page qu'ils concernent.
        checkedBy: manual
      - level: should
        statement: Pour une confirmation courte, utilisez <dsds:modal>.
        alternatives:
          - to: modal
        checkedBy: manual

  - kind: guidelines
    for: all
    title: Accessibilité
    items:
      - level: must
        statement: Donnez au tiroir un `label`. Il s'affiche en titre, et nomme la boîte de dialogue.
        checks:
          - href: npm:@unicorne/catalog#required-attribute
            role: lint-rule
        checkedBy: automated
        $extensions:
          dev.unicorne:
            check:
              attributes:
                - label
      - level: must
        statement: Traduisez `close-label`. Il nomme le bouton de fermeture, qui ne montre qu'une icône.
        checkedBy: manual

refs:
  - href: ./drawer.stories.ts
    rel: demo
    role: Stories (CSF)

sourceFiles:
  - platform: web-component
    file: ./drawer.ts

imports:
  - platform: web-component
    code: import "@unicorne/components/define";
    package: "@unicorne/components"

specs:
  - href: ../../../custom-elements.json
    role: Custom Elements Manifest
