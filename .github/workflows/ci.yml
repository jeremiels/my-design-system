# Everything that must hold before merging (see AGENTS.md, Workflows).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, API, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest runs the stories in all three engines.
      - run: npx playwright install --with-deps chromium firefox webkit
      # oxlint, oxfmt --check, tsc, api:check (committed manifest up to
      # date), Vitest: unit, browser (registry, tokens), and stories with axe
      # and, in Chromium, against their reference screenshots.
      - run: npm run check
      - name: Upload Vitest failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-attachments
          path: .vitest/
          if-no-files-found: ignore

  package:
    name: Package, examples, browser support
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium for the smoke tests of the brand and the Vue app.
      - run: npx playwright install --with-deps chromium
      # Builds and packs the base, then installs, builds and tests ACME
      # against the tarballs, as a brand would consume them. Then packs ACME
      # and does the same for the Vue app, as an application would.
      - run: npm run example
      # es-check and doiuse against the browserslist matrix.
      - run: npm run compat
