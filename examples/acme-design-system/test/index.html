<!doctype html>
<html lang="fr" data-brand="acme">
  <head>
    <meta charset="UTF-8" />
    <title>ACME design system — smoke test</title>
    <!-- ACME's build, as published: the base's styles then ACME's theme. -->
    <link rel="stylesheet" href="/dist/styles.css" />
    <!-- Bare specifiers resolve to the installed packages, as a bundler would. -->
    <script type="importmap">
      {
        "imports": {
          "@unicorne/components": "/node_modules/@unicorne/components/dist/index.js",
          "@unicorne/icons": "/node_modules/@unicorne/icons/js/index.js",
          "@unicorne/icons/chevron-down": "/node_modules/@unicorne/icons/js/chevron-down.js",
          "@unicorne/icons/chevron-left": "/node_modules/@unicorne/icons/js/chevron-left.js",
          "@unicorne/icons/chevron-right": "/node_modules/@unicorne/icons/js/chevron-right.js",
          "@unicorne/icons/chevron-up": "/node_modules/@unicorne/icons/js/chevron-up.js",
          "@unicorne/icons/chevron-up-down": "/node_modules/@unicorne/icons/js/chevron-up-down.js",
          "@unicorne/tokens/testing": "/node_modules/@unicorne/tokens/dist/testing/contrast.js",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/"
        }
      }
    </script>
    <script>
      window.__errors = [];
      addEventListener("error", (event) => window.__errors.push(String(event.message)));
      addEventListener("unhandledrejection", (event) => window.__errors.push(String(event.reason)));
    </script>
    <script
      type="module"
      src="./checks.js"
      onerror="window.__errors.push('checks.js failed to load')"
    ></script>
  </head>
  <body>
    <acme-button id="button">Valider</acme-button>
    <acme-card id="card" heading="Offre" action-label="Souscrire">Contenu de la carte</acme-card>
    <acme-button id="open-modal" commandfor="modal" command="--show-modal">Ouvrir</acme-button>
    <acme-modal id="modal" label="Exemple" close-label="Fermer">
      <p>Contenu</p>
    </acme-modal>
    <acme-alert variant="success">Enregistré</acme-alert>
    <acme-alert id="alert" variant="information">Nouvelle version disponible</acme-alert>
    <acme-icon id="star" name="star" label="Favori"></acme-icon>
    <form id="form">
      <acme-text-field
        id="field"
        label="E-mail"
        name="email"
        type="email"
        value="ada@example.com"
      ></acme-text-field>
      <acme-textarea id="message" label="Message" name="message" value="Bonjour"></acme-textarea>
      <acme-autocomplete id="city" label="Ville" name="city">
        <option value="Paris"></option>
        <option value="Pau"></option>
        <option value="Lyon"></option>
      </acme-autocomplete>
    </form>
  </body>
</html>
